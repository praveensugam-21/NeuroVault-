worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Rate Limiting Zones ───────────────────────────────────────────────────
    # Strict limit for auth endpoints (login, register, refresh)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # General API limit per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ── Upstream Services ─────────────────────────────────────────────────────
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:80;
    }

    # ── HTTP → HTTPS Redirect (for production) ────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow local deployments without HTTPS (remove this for production VPS)
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            # Rate limit all API calls
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Increase timeout for long-running document processing
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }

        # Strict rate limiting for authentication endpoints
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend health check passthrough (no rate limit)
        location /health {
            proxy_pass http://backend_api/health;
        }
    }
}
