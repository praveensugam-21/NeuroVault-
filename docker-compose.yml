version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount directories to persist database, vector store, and uploads outside the container
      - ./backend/uploads:/app/uploads
      - ./backend/vector_store:/app/vector_store
      - ./backend/neurovault.db:/app/neurovault.db
    environment:
      - ENV_MODE=production
      - DATABASE_URL=sqlite:////app/neurovault.db
      - CHROMA_PERSIST_DIR=/app/vector_store
      - UPLOADS_DIR=/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
