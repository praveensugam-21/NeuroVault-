services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: iris_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iris}
      POSTGRES_USER: ${POSTGRES_USER:-iris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iris_user} -d ${POSTGRES_DB:-iris}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iris-net

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: iris_backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    environment:
      ENV_MODE: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-iris}
      POSTGRES_USER: ${POSTGRES_USER:-iris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_ME_run_openssl_rand_hex_32}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-CHANGE_ME_run_fernet_generate_key}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CHROMA_PERSIST_DIR: /data/chromadb
      UPLOADS_DIR: /data/uploads
      MODEL_CACHE_DIR: /data/model-cache
      HF_HOME: /data/model-cache/huggingface
    volumes:
      - ./backend/app:/app/app
      - uploads:/data/uploads
      - chromadb-data:/data/chromadb
      - model-cache:/data/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iris-net

  # ── Containerized Ollama (Offline LLM) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: iris_ollama
    restart: unless-stopped
    volumes:
      # Mounts to local project folder (E: drive) to avoid filling up C: drive
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - iris-net

  # ── React Frontend ────────────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: iris_frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - iris-net

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: iris_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - iris-net

# ── Named Volumes (Persistent Storage) ──────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  uploads:
    driver: local
  chromadb-data:
    driver: local
  model-cache:
    driver: local

# ── Internal Docker Network ──────────────────────────────────────────────────────
networks:
  iris-net:
    driver: bridge
