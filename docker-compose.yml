version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/vector_store:/app/vector_store
      - ./backend/data:/app/data
      - ./backend/cache/huggingface:/root/.cache/huggingface
      - ./backend/cache/easyocr:/root/.easyocr
    environment:
      - ENV_MODE=production
      - DATABASE_URL=sqlite:////app/data/neurovault.db
      - CHROMA_PERSIST_DIR=/app/vector_store
      - UPLOADS_DIR=/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
